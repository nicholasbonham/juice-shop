name: Claude Security Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  security-gate:
    name: Claude GHAS Security Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: read  # required to query GHAS alerts
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for CodeQL to complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Waiting for CodeQL analysis to complete..."
          for i in $(seq 1 20); do
            STATUS=$(gh api \
              "repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha }}/check-runs" \
              --jq '.check_runs[] | select(.name | test("CodeQL|Analyze")) | .status' \
              2>/dev/null | head -1)
            CONCLUSION=$(gh api \
              "repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha }}/check-runs" \
              --jq '.check_runs[] | select(.name | test("CodeQL|Analyze")) | .conclusion' \
              2>/dev/null | head -1)
      
            echo "Attempt $i: status=$STATUS conclusion=$CONCLUSION"
      
            if [ "$STATUS" = "completed" ]; then
              echo "CodeQL finished with conclusion: $CONCLUSION"
              exit 0
            fi
      
            sleep 30
          done
          echo "Timed out waiting for CodeQL — proceeding anyway"
          exit 0

      - name: Fetch GHAS alerts for this PR branch
        id: ghas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          REPO="${{ github.repository }}"

          # Fetch open Critical and High alerts on this branch
          gh api \
            "repos/${REPO}/code-scanning/alerts?ref=refs/heads/${BRANCH}&state=open&per_page=100" \
            > /tmp/all-alerts.json

          echo "=== Trying branch name only ==="
          gh api "repos/${REPO}/code-scanning/alerts?ref=${BRANCH}&state=open&per_page=100" | jq 'length'

          echo "=== Trying refs/heads/ prefix ==="
          gh api "repos/${REPO}/code-scanning/alerts?ref=refs/heads/${BRANCH}&state=open&per_page=100" | jq 'length'
      
          echo "=== Trying no ref filter (all alerts) ==="
          gh api "repos/${REPO}/code-scanning/alerts?state=open&per_page=100" | jq 'length'
      
          echo "=== Sample ref values from existing alerts ==="
          gh api "repos/${REPO}/code-scanning/alerts?state=open&per_page=5" | jq '.[].most_recent_instance.ref'

          # Summarise counts by severity for the prompt
          echo "CRITICAL=$(jq '[.[] | select(.rule.security_severity_level=="critical")] | length' /tmp/all-alerts.json)" >> $GITHUB_OUTPUT
          echo "HIGH=$(jq '[.[] | select(.rule.security_severity_level=="high")] | length' /tmp/all-alerts.json)" >> $GITHUB_OUTPUT
          echo "MEDIUM=$(jq '[.[] | select(.rule.security_severity_level=="medium")] | length' /tmp/all-alerts.json)" >> $GITHUB_OUTPUT
          echo "LOW=$(jq '[.[] | select(.rule.security_severity_level=="low")] | length' /tmp/all-alerts.json)" >> $GITHUB_OUTPUT

          # Write a compact findings file for Claude to read
          jq '[.[] | {
            id: .number,
            rule: .rule.id,
            name: .rule.name,
            severity: .rule.security_severity_level,
            description: .rule.full_description,
            file: .most_recent_instance.location.path,
            start_line: .most_recent_instance.location.start_line,
            cwe: .rule.tags,
            dismissed: (.dismissed_reason // "not dismissed"),
            alert_url: .html_url
          }]' /tmp/all-alerts.json > /tmp/ghas-findings.json

          echo "Findings summary: Critical=${{ steps.ghas.outputs.CRITICAL }} High=${{ steps.ghas.outputs.HIGH }}"

      - name: Run Claude security gate
        uses: anthropics/claude-code-action@v1
        env:
          GHAS_CRITICAL: ${{ steps.ghas.outputs.CRITICAL }}
          GHAS_HIGH: ${{ steps.ghas.outputs.HIGH }}
          GHAS_MEDIUM: ${{ steps.ghas.outputs.MEDIUM }}
          GHAS_LOW: ${{ steps.ghas.outputs.LOW }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ github.event.pull_request.number }}
          prompt: |
            You are a security gate for this pull request on ${{ github.repository }}.

            ## Your task
            Review the GHAS code scanning findings on branch
            `${{ github.event.pull_request.head.ref }}` and apply the security
            policy defined in CLAUDE.md to determine whether this PR should be
            APPROVED or BLOCKED.

            ## Findings summary
            - Critical: ${{ steps.ghas.outputs.CRITICAL }}
            - High:     ${{ steps.ghas.outputs.HIGH }}
            - Medium:   ${{ steps.ghas.outputs.MEDIUM }}
            - Low:      ${{ steps.ghas.outputs.LOW }}

            ## Full findings
            Read the file /tmp/ghas-findings.json for the complete alert list.

            ## Instructions
            1. Group findings by severity and CWE category.
            2. For each Critical and High finding, note the file, line, rule
               name, and a brief plain-English description of the risk.
            3. Apply the gate policy from CLAUDE.md.
            4. Post a structured PR comment (use markdown) with:
               - A clear BLOCKED or APPROVED verdict at the top
               - A findings table (severity | rule | file:line | risk summary)
               - A "What to fix" section for any blocking findings
               - A "Warnings" section for Medium/Low findings
             5. Write your verdict to /tmp/gate-verdict.txt as a single word: either BLOCKED or APPROVED
      
      - name: Enforce gate verdict
        run: |
          if [ -f /tmp/gate-verdict.txt ]; then
            VERDICT=$(cat /tmp/gate-verdict.txt | tr -d '[:space:]')
            echo "Gate verdict: $VERDICT"
            if [ "$VERDICT" = "BLOCKED" ]; then
              echo "Security gate BLOCKED this PR — failing the check"
              exit 1
            else
              echo "Security gate APPROVED this PR"
              exit 0
            fi
          else
            echo "No verdict file found — Claude may not have completed correctly"
            exit 1
          fi
                 
